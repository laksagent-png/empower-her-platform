    <script>
      // Single Page Apps for GitHub Pages
      // Restores the original URL that was encoded by 404.html redirect.
      // See: https://github.com/rafgraph/spa-github-pages
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            // Remove trailing slash from pathname before appending the decoded path
            l.pathname.replace(/\/$/, "") + decoded + l.hash
          );
        }
      })(window.location);
