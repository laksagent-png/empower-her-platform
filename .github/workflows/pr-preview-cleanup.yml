name: PR Preview Cleanup

# Removes the preview subdirectory from GitHub Pages when a PR is closed
# (merged or abandoned), keeping the gh-pages branch tidy.

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    name: Remove Preview
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout gh-pages branch
        id: checkout_gh_pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
        continue-on-error: true

      - name: Delete preview directory and push
        if: steps.checkout_gh_pages.outcome == 'success'
        run: |
          PR_DIR="pr-previews/${{ github.event.pull_request.number }}"
          if [ -d "$PR_DIR" ]; then
            rm -rf "$PR_DIR"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git diff --staged --quiet || git commit -m "chore: remove preview for PR #${{ github.event.pull_request.number }}"
            git push
          fi
