name: PR Preview

# Deploys a live preview of every pull request to a subdirectory on GitHub Pages.
#
# SETUP (one-time, done by a repo admin):
#   1. Go to Settings → Pages.
#   2. Set "Source" to "Deploy from a branch".
#   3. Select branch "gh-pages" and folder "/ (root)".
#   4. Save.
#
# After the first production deploy (deploy.yml) and the first PR preview build,
# previews will be reachable at:
#   https://laksagent-png.github.io/empower-her-platform/pr-previews/<PR_NUMBER>/

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build & Deploy Preview
    runs-on: ubuntu-latest
    # Only deploy previews for PRs opened within the same repository so that
    # fork PRs (which cannot write to gh-pages) don't fail here.
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build preview
        # Build with the PR-specific base path and enable mock data so no
        # Firebase credentials are required.
        run: npx vite build --base /empower-her-platform/pr-previews/${{ github.event.pull_request.number }}/
        env:
          VITE_USE_MOCK_DATA: "true"

      - name: Deploy preview to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: pr-previews/${{ github.event.pull_request.number }}
          # Preserve all other files (production build + other PR previews).
          keep_files: true

      - name: Post preview URL as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const previewUrl = `https://laksagent-png.github.io/empower-her-platform/pr-previews/${prNumber}/`;
            const marker = '<!-- pr-preview-comment -->';
            const body = [
              marker,
              '## 🔍 PR Preview',
              '',
              'A live preview of this PR has been deployed!',
              '',
              `🔗 **[Open Preview](${previewUrl})**`,
              '',
              '> ⚠️ This preview uses **mock data** — Firebase is not active.',
              '> All events shown are sample data from the built-in event store.',
              '',
              `_Last updated: ${new Date().toUTCString()}_`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
